name: CI

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# ─── Concurrency ──────────────────────────────────────────────────────────────
# Cancel any in-progress run for the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─── Shared env ───────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Lint & Type Check ─────────────────────────────────────────────────────
  # Fastest job — fails early before the slower jobs consume runner time.
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript — strict type check
        run: npm run type-check

  # ── 2. Unit & Integration Tests ──────────────────────────────────────────────
  # Runs in parallel with the quality job — both must pass before build.
  test-unit:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
        # Always upload so we can inspect even on failure
        if: always()

  # ── 3. Content Integrity Tests ────────────────────────────────────────────────
  # Runs in parallel. Validates all static data files against business rules.
  # Also runs as "prebuild" locally — belt-and-suspenders in CI.
  test-integrity:
    name: Content Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run content integrity tests
        run: npm run test:integrity

  # ── 4. Build Smoke Test ───────────────────────────────────────────────────────
  # Runs only after all three checks above pass. Verifies the production bundle
  # compiles without errors. Uses placeholder env vars — no real secrets needed
  # for a build smoke test.
  build:
    name: Build Smoke Test
    runs-on: ubuntu-latest
    needs: [quality, test-unit, test-integrity]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          # Placeholders — build must not require real secrets to succeed.
          # If a secret is read at build time, wrap it in an optional check.
          RESEND_API_KEY:              ci-build-placeholder
          RESEND_FROM_EMAIL:           no-reply@sigmatech.co.uk
          RESEND_NOTIFY_EMAIL:         hello@sigmatech.co.uk
          NEXT_PUBLIC_SITE_URL:        https://sigmatech.co.uk
          NEXT_PUBLIC_POSTHOG_KEY:     ci-build-placeholder
          NEXT_PUBLIC_POSTHOG_HOST:    https://eu.i.posthog.com
          CONTACT_RATE_LIMIT_MAX:      "3"

      - name: Check bundle size (optional reporting)
        run: |
          echo "=== .next/BUILD_ID ===" && cat .next/BUILD_ID
          echo "=== Static pages generated ===" && ls .next/server/app | head -20
        if: success()
