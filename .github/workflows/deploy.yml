name: Deploy

# ─── Triggers ─────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main       # → Production
      - develop    # → Staging preview
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop]  # → PR preview URL

# ─── Concurrency ──────────────────────────────────────────────────────────────
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION:      "20"
  VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# ─── Jobs ─────────────────────────────────────────────────────────────────────
jobs:

  # ── Preview Deployment ────────────────────────────────────────────────────────
  # Triggered on every PR and every push to `develop`.
  # Posts the preview URL as a PR comment so reviewers can view the build.
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    outputs:
      preview-url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (preview)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel (preview)
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel preview
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview-url=$URL" >> $GITHUB_OUTPUT
          echo "Deployed to: $URL"

      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.preview-url }}';
            const sha  = context.sha.slice(0, 7);
            const body = [
              `## Preview Deployment`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **URL** | [${url}](${url}) |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Branch** | \`${context.ref.replace('refs/heads/', '')}\` |`,
              ``,
              `> Deployed by the \`deploy\` workflow · [View run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            // Update existing bot comment rather than spamming new ones
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              c => c.user.type === 'Bot' && c.body.includes('Preview Deployment')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── Production Deployment ────────────────────────────────────────────────────
  # Triggered only on a push to `main` (i.e. a PR merge).
  # Re-runs all checks before deploying — never trust a stale CI status.
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://sigmatech.co.uk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Re-run content integrity before production deploy as a final gate
      - name: Content integrity gate
        run: npm run test:integrity

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (production)
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel (production)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel production
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "production-url=$URL" >> $GITHUB_OUTPUT
          echo "Production deployed to: $URL"

      - name: Smoke test production URL
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://sigmatech.co.uk)
          echo "Homepage HTTP status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
